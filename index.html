<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ノリ・ラボ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<link rel="stylesheet" href="/src/style.css">

<div class="wrap">
  <header>
    <h1>ノリ・<span>ラボ</span></h1>
    <p class="sub">表拍の遅れ × 裏拍の距離で 8分音符を鳴らし続ける</p>
  </header>

  <section class="panel scope">
    <div class="views">
      <canvas id="dial" role="img" aria-label="円のタイミング表示（1周＝1拍。丸と針をドラッグで調整）"></canvas>
      <canvas id="cv" aria-label="2拍分のタイミング表示"></canvas>
    </div>
    <div class="legend">
      <span><i style="background:var(--grid)"></i>ビート（リズム隊のグリッド）</span>
      <span><i style="background:var(--down)"></i>表拍の8分</span>
      <span><i style="background:var(--up)"></i>裏拍の8分</span>
      <span><i style="background:var(--grid);opacity:.4"></i>ストレートの裏（50%）</span>
    </div>
    <div class="readout">
      <div><small>遅れ値</small><b id="r-lag">—</b></div>
      <div><small>ハネ値</small><b id="r-hane">—</b></div>
      <div><small>裏拍値</small><b id="r-ura">—</b></div>
      <div><small>スウィング比</small><b id="r-ratio">—</b></div>
      <div><small>1拍の長さ</small><b id="r-beat">—</b></div>
    </div>
  </section>

  <section class="panel controls">
    <div class="row">
      <label for="bpm">テンポ<em>BPM（4分音符）</em></label>
      <input type="range" id="bpm-r" min="60" max="320" step="1" value="180" aria-label="テンポ">
      <div class="num"><input type="number" id="bpm" min="40" max="400" step="1" value="180"><span>bpm</span></div>
    </div>
    <div class="row">
      <label for="delay">表拍の遅れ<em>ビートからのズレ。マイナスで前ノリ</em></label>
      <input type="range" id="delay-r" min="-80" max="120" step="1" value="25" aria-label="表拍の遅れ">
      <div class="num"><input type="number" id="delay" min="-150" max="200" step="1" value="25"><span>ms</span></div>
    </div>
    <div class="row">
      <label for="lag">遅れ値<em>表拍の遅れ ÷ 1拍。テンポを変えても保たれる</em></label>
      <input type="range" id="lag-r" min="-0.15" max="0.3" step="0.005" value="0.075" aria-label="遅れ値">
      <div class="num"><input type="number" id="lag" min="-0.5" max="0.5" step="0.005" value="0.075"><span>拍</span></div>
    </div>
    <div class="row">
      <label for="dist">ハネ値<em>表拍8分の長さ ÷ 1拍（=表拍から裏拍までの距離）</em></label>
      <input type="range" id="dist-r" min="40" max="80" step="0.5" value="60" aria-label="裏拍の距離">
      <div class="num"><input type="number" id="dist" min="30" max="90" step="0.5" value="60"><span>%</span></div>
    </div>

    <div class="bar">
      <button id="play" aria-pressed="false">▶ 再生</button>
      <select id="prog" aria-label="コード進行">
        <option value="blues">B♭ブルース（12小節）</option>
        <option value="rhythm">循環（リズム・チェンジ A）</option>
        <option value="iivi">II–V–I（B♭）</option>
        <option value="one">ワンコード（B♭7）</option>
      </select>
      <div class="chk">
        <label><input type="checkbox" id="m-ride" checked>ライド（4分）</label>
        <label><input type="checkbox" id="m-hh" checked>ハイハット（2・4）</label>
        <label><input type="checkbox" id="m-bass" checked>ベース（4分）</label>
        <label><input type="checkbox" id="m-acc">裏拍アクセント</label>
        <label><input type="checkbox" id="m-mono">単音にする</label>
        <label><input type="checkbox" id="m-t8" checked>円に8分の目盛り</label>
        <label><input type="checkbox" id="m-t3" checked>円に3連の目盛り</label>
      </div>
    </div>

    <div class="vol" role="group" aria-labelledby="vol-h">
      <h2 id="vol-h">音量</h2>
      <div class="row">
        <label for="vol-all">全体<em>0 で無音</em></label>
        <input type="range" id="vol-all-r" min="0" max="100" step="1" value="100" aria-label="音量（全体）">
        <div class="num"><input type="number" id="vol-all" min="0" max="100" step="1" value="100"><span>%</span></div>
      </div>
      <div class="row">
        <label for="vol-horn">ホーン</label>
        <input type="range" id="vol-horn-r" min="0" max="150" step="1" value="100" aria-label="音量（ホーン）">
        <div class="num"><input type="number" id="vol-horn" min="0" max="150" step="1" value="100"><span>%</span></div>
      </div>
      <div class="row">
        <label for="vol-bass">ベース</label>
        <input type="range" id="vol-bass-r" min="0" max="150" step="1" value="100" aria-label="音量（ベース）">
        <div class="num"><input type="number" id="vol-bass" min="0" max="150" step="1" value="100"><span>%</span></div>
      </div>
      <div class="row">
        <label for="vol-drums">ドラム<em>ライド＋ハイハット</em></label>
        <input type="range" id="vol-drums-r" min="0" max="150" step="1" value="100" aria-label="音量（ドラム）">
        <div class="num"><input type="number" id="vol-drums" min="0" max="150" step="1" value="100"><span>%</span></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2 id="preset-h">誰風で吹く？</h2>
    <div class="pbar">
      <select id="preset" aria-labelledby="preset-h"></select>
      <button id="pdel" hidden>削除</button>
    </div>
    <p id="pinfo"></p>
    <div class="custom">
      <input type="text" id="pname" placeholder="名前（例：自分のノリ）" aria-label="プリセット名">
      <button id="psave">今のノリを保存</button>
    </div>
    <p class="note" style="margin-top:12px">プレイヤーの値は、録音を 1 音ずつ測った研究（井上裕章ほか, 音楽知覚認知研究 23(1), 2017）の中央値。押すと録音のテンポになる。バディ・リッチはドラム（ハイハット）の値。保存したノリはこのブラウザにだけ残る。スペースキーで再生／停止。</p>
  </section>
</div>

<script type="module" src="/src/main.ts"></script>
